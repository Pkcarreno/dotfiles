[dotfiles]
"~/mise.toml" = { mode = "copy" }
"~/.config/mise" = { mode = "copy", exclude = ["*.local.toml"] }
"~/.config/bat" = { mode = "copy" }
"~/.config/gitui" = { mode = "copy" }
"~/.config/git" = { mode = "copy" }
"~/.config/tmux" = { mode = "copy", exclude = ["local.conf"] }
"~/.config/powershell" = { mode = "copy", exclude = ["local.ps1"] }
